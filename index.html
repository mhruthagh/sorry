<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff6b9a">
    <title>I'm Sorry, Ayshu ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hearts"></div>

    <main class="container">
        <div class="card">
            <div class="emoji">🥺</div>
            <p class="small-text">Hey Ayshu...</p>
            <h1>I'm Sorry Maa❤️</h1>
            <div class="divider"></div>

            <p class="message">
                I know I may have hurt you, and honestly,
                that's the last thing I ever wanted to do.
            </p>

            <p class="message">
                You're really special to me, and I don't want
                one silly mistake to come between us.
            </p>

            <p class="message highlight">
                So... will you forgive me? 🥺👉👈
            </p>

            <button id="forgiveBtn">Forgive Me ❤️</button>
            <button id="noBtn">Not Yet 😤</button>

            <div id="response" class="response"></div>
            <div class="signature">— Your Bestie 💕</div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
